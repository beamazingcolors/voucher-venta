<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Sistema de Reservas - Confirmation Voucher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        html {
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
        }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
        }
        
        /* Mobile Input Zoom Prevention (iOS Fix) */
        @media (max-width: 639px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f4f4f5;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4d4d8;
            border-radius: 9999px;
        }
        
        /* Modernized Date Picker Styling */
        input[type="date"] {
            min-height: 42px;
            position: relative;
            cursor: pointer;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            background: transparent;
            bottom: 0;
            color: transparent;
            cursor: pointer;
            height: auto;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            width: auto;
            z-index: 2;
        }

        /* High definition single/multi-page print rules */
        @media print {
            @page {
                size: A4 portrait;
                margin: 4mm 5mm;
            }
            html, body { 
                background: white !important; 
                color: #09090b !important; 
                padding: 0 !important; 
                margin: 0 !important;
                height: auto !important;
                overflow: visible !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print { 
                display: none !important; 
            }
            .voucher-card-item { 
                border: 1px solid #d4d4d8 !important; 
                box-shadow: none !important; 
                margin: 0 auto 1rem auto !important; 
                padding: 1rem 1.25rem !important; 
                width: 100% !important; 
                max-width: 100% !important; 
                box-sizing: border-box !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                page-break-after: always !important;
                break-after: page !important;
                height: auto !important;
                border-radius: 0.75rem !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .summary-sheet-item {
                border: 2px solid #18181b !important;
                box-shadow: none !important;
                margin: 0 auto !important;
                padding: 1.25rem !important;
                width: 100% !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                page-break-before: always !important;
                break-before: page !important;
                border-radius: 0.75rem !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body class="bg-zinc-100/90 text-zinc-800 min-h-screen antialiased selection:bg-zinc-900 selection:text-white pb-12">

    <div class="max-w-7xl mx-auto px-3 py-4 sm:px-6 sm:py-6 md:px-8 md:py-8 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Form Section -->
        <div id="form-container" class="lg:col-span-5 w-full bg-white p-4 sm:p-5 md:p-6 rounded-2xl border border-zinc-200/90 shadow-sm h-fit no-print overflow-hidden">
            
            <!-- Header & Language Switcher & Batch Count -->
            <div class="border-b border-zinc-100 pb-3.5 mb-4 space-y-3">
                <div class="flex items-center justify-between gap-2">
                    <div class="min-w-0">
                        <h2 data-i18n="titleForm" class="text-base sm:text-lg md:text-xl font-bold tracking-tight text-zinc-900 truncate">
                            Captura de Reserva
                        </h2>
                        <p data-i18n="subtitleForm" class="text-[11px] text-zinc-400 font-medium hidden sm:block">Ingrese los detalles para generar el voucher</p>
                    </div>
                    
                    <div class="inline-flex p-1 bg-zinc-100 rounded-xl border border-zinc-200/80 flex-shrink-0">
                        <button type="button" id="btn-lang-es" onclick="switchLanguage('es')" class="px-2.5 py-1.5 sm:py-1 text-xs font-semibold rounded-lg transition-all bg-white text-zinc-900 shadow-xs active:scale-95">
                            🇲🇽 ES
                        </button>
                        <button type="button" id="btn-lang-en" onclick="switchLanguage('en')" class="px-2.5 py-1.5 sm:py-1 text-xs font-semibold rounded-lg transition-all text-zinc-500 hover:text-zinc-900 active:scale-95">
                            🇺🇸 EN
                        </button>
                    </div>
                </div>

                <!-- Multi-Booking Selector Pill -->
                <div class="p-2.5 bg-zinc-900 text-white rounded-xl flex items-center justify-between gap-2 shadow-sm">
                    <div class="min-w-0">
                        <span data-i18n="lblCantReservas" class="block text-[11px] font-bold uppercase tracking-wider text-zinc-300">Cantidad de Reservas</span>
                        <span data-i18n="subCantReservas" class="text-[9px] text-zinc-400 block truncate">Máximo 10 reservas en un solo voucher</span>
                    </div>
                    <select id="select-cant-reservas" onchange="changeCantidadReservas(parseInt(this.value))" class="bg-zinc-800 text-white text-xs font-extrabold px-3 py-1.5 rounded-lg border border-zinc-700 focus:outline-none focus:ring-2 focus:ring-emerald-400 cursor-pointer">
                        <option value="1">1 Reserva</option>
                        <option value="2">2 Reservas</option>
                        <option value="3">3 Reservas</option>
                        <option value="4">4 Reservas</option>
                        <option value="5">5 Reservas</option>
                        <option value="6">6 Reservas</option>
                        <option value="7">7 Reservas</option>
                        <option value="8">8 Reservas</option>
                        <option value="9">9 Reservas</option>
                        <option value="10">10 Reservas</option>
                    </select>
                </div>

                <!-- Dynamic Reservation Tabs Bar -->
                <div id="tabs-reservas-bar" class="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                    <!-- Tab buttons injected via JS -->
                </div>
            </div>
            
            <form id="reserveForm" class="space-y-3.5" onsubmit="event.preventDefault();">
                
                <!-- Client Name -->
                <div>
                    <label data-i18n="lblCliente" class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-500 mb-1">Nombre del Cliente</label>
                    <input type="text" id="nombreCliente" required placeholder="Ej. Juan Pérez" class="w-full px-3.5 py-2 border border-zinc-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:border-transparent transition-all shadow-2xs">
                </div>

                <!-- Client Phone -->
                <div>
                    <label data-i18n="lblTelefono" class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-500 mb-1">Teléfono / WhatsApp</label>
                    <input type="tel" id="telefono" placeholder="Ej. +52 998 123 4567" class="w-full px-3.5 py-2 border border-zinc-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:border-transparent transition-all shadow-2xs">
                </div>

                <!-- Hotel / Lodging -->
                <div>
                    <label data-i18n="lblHotel" class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-500 mb-1">Hotel / Hospedaje</label>
                    <input type="text" id="hotel" placeholder="Ej. Grand Oasis / Airbnb" class="w-full px-3.5 py-2 border border-zinc-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:border-transparent transition-all shadow-2xs">
                </div>

                <!-- Activity Selection -->
                <div>
                    <label data-i18n="lblActividad" class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-500 mb-1">Actividad / Embarcación</label>
                    <select id="actividad" required class="w-full px-3.5 py-2 border border-zinc-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:border-transparent transition-all shadow-2xs">
                        <option value="">Cargando catálogo...</option>
                    </select>
                    <input type="text" id="otraActividad" placeholder="Especificar actividad manualmente" class="hidden mt-2 w-full px-3.5 py-2 border border-zinc-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 transition-all shadow-2xs">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    <div>
                        <label data-i18n="lblFechaReserva" class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-500 mb-1">Fecha de Reserva (Hoy)</label>
                        <div class="relative flex items-center">
                            <input type="date" id="fechaReserva" readonly tabindex="-1" class="w-full px-3.5 py-2 pr-10 border border-zinc-200 rounded-xl text-sm bg-zinc-100 text-zinc-600 font-medium cursor-not-allowed shadow-2xs focus:outline-none pointer-events-none">
                            <div class="absolute right-3 pointer-events-none text-zinc-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label data-i18n="lblFechaServicio" class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-500 mb-1">Fecha del Servicio</label>
                        <div class="relative flex items-center">
                            <input type="date" id="fecha" required class="w-full px-3.5 py-2 pr-10 border border-zinc-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-zinc-950 focus:border-transparent transition-all shadow-2xs font-medium text-zinc-800">
                            <div class="absolute right-3 pointer-events-none text-zinc-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Passengers Count -->
                <div class="grid grid-cols-2 gap-3 min-w-0">
                    <div>
                        <label data-i18n="lblAdultos" class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-500 mb-1 truncate">Adultos</label>
                        <select id="adultos" required class="w-full px-2.5 py-2 border border-zinc-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-zinc-950 transition-all shadow-2xs">
                        </select>
                    </div>
                    <div>
                        <label data-i18n="lblMenores" class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-500 mb-1 truncate">Menores (4-11)</label>
                        <select id="menores" required class="w-full px-2.5 py-2 border border-zinc-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-zinc-950 transition-all shadow-2xs">
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5 min-w-0">
                    <div class="min-w-0">
                        <label data-i18n="lblCheckin" class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-500 mb-1">Check In</label>
                        <div class="flex items-center gap-1.5">
                            <select id="checkin" required class="w-full px-2 py-2 border border-zinc-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-zinc-950 transition-all shadow-2xs font-medium">
                            </select>
                            <div class="inline-flex p-1 bg-zinc-100 rounded-xl border border-zinc-200/80 flex-shrink-0">
                                <button type="button" id="btn-period-am" onclick="setCheckinPeriod('AM')" class="px-2 py-1 text-xs font-bold rounded-lg transition-all bg-white text-zinc-900 shadow-xs active:scale-95">AM</button>
                                <button type="button" id="btn-period-pm" onclick="setCheckinPeriod('PM')" class="px-2 py-1 text-xs font-bold rounded-lg transition-all text-zinc-500 hover:text-zinc-900 active:scale-95">PM</button>
                            </div>
                        </div>
                    </div>
                    <div class="sm:col-span-2 min-w-0">
                        <label data-i18n="lblCheckpoint" class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-500 mb-1">Punto de Encuentro</label>
                        <input type="text" id="checkpoint" required placeholder="Ej. Marina Imperial" class="w-full px-3.5 py-2 border border-zinc-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 transition-all shadow-2xs">
                    </div>
                </div>

                <!-- Payment Breakdown (Deposit, Saldo, Currency) -->
                <div class="p-3 bg-zinc-50/90 rounded-xl border border-zinc-200/80 space-y-2.5">
                    <div class="flex items-center justify-between">
                        <span data-i18n="lblDesglosePago" class="block text-xs font-bold uppercase tracking-wider text-zinc-700">Desglose de Pago</span>
                        <div class="flex items-center gap-1.5">
                            <label data-i18n="lblDivisa" class="text-[10px] font-bold uppercase text-zinc-400">Divisa</label>
                            <select id="divisa" class="px-2 py-1 border border-zinc-300 rounded-lg text-xs bg-white font-bold text-zinc-800 focus:outline-none focus:ring-2 focus:ring-zinc-950 shadow-2xs">
                                <option value="MXN">MXN</option>
                                <option value="USD">USD</option>
                                <option value="EUR">EUR (€)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label data-i18n="lblDeposito" class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-1">Depósito / Anticipo</label>
                            <input type="number" id="deposito" min="0" step="any" placeholder="0.00" value="" class="w-full px-3 py-1.5 border border-zinc-300 rounded-lg text-sm font-medium focus:outline-none focus:ring-2 focus:ring-zinc-950 bg-white shadow-2xs">
                        </div>
                        <div>
                            <label data-i18n="lblSaldo" class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-500 mb-1">Saldo Pendiente</label>
                            <input type="number" id="saldo" min="0" step="any" placeholder="0.00" value="" class="w-full px-3 py-1.5 border border-zinc-300 rounded-lg text-sm font-medium focus:outline-none focus:ring-2 focus:ring-zinc-950 bg-white shadow-2xs">
                        </div>
                    </div>

                    <div class="pt-2 border-t border-zinc-200/80 flex justify-between items-center text-xs">
                        <span data-i18n="lblTotalBalance" class="font-medium text-zinc-600">Balance Total (Suma):</span>
                        <span id="txt-balance-total" class="font-extrabold text-sm text-zinc-900">$0.00 MXN</span>
                    </div>
                </div>

                <!-- Internal Currency Converter -->
                <div class="p-2.5 bg-zinc-50/90 rounded-xl border border-zinc-200/80">
                    <span data-i18n="lblConversor" class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1.5">Conversor de Divisas Interno</span>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <label data-i18n="lblTC" class="block text-[10px] text-zinc-400 uppercase font-semibold mb-0.5">T.C. Selección</label>
                            <select id="tipoCambio" class="w-full p-1.5 border border-zinc-300 rounded-lg bg-white focus:outline-none text-xs font-medium">
                            </select>
                        </div>
                        <div>
                            <label data-i18n="lblEquivalencia" class="block text-[10px] text-zinc-400 uppercase font-semibold mb-0.5">Equivalencia Estimada</label>
                            <div id="calculoConversion" class="font-semibold pt-1 text-zinc-800 text-xs truncate">---</div>
                        </div>
                    </div>
                </div>

                <div>
                    <label data-i18n="lblNotas" class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-500 mb-1">Notas / Observaciones del Servicio</label>
                    <textarea id="notas" rows="2" placeholder="Restricciones alimenticias, decoraciones, itinerarios especiales..." class="w-full px-3.5 py-2 border border-zinc-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-zinc-950 transition-all shadow-2xs"></textarea>
                </div>

                <!-- Confirmation Code -->
                <div>
                    <label data-i18n="lblConfirmacion" class="block text-[11px] font-semibold uppercase tracking-wider text-zinc-500 mb-1">Confirmación Automática</label>
                    <input type="text" id="confirmacion" readonly class="w-full px-3.5 py-2 bg-zinc-100/80 border border-zinc-200 rounded-xl text-sm font-mono text-zinc-600 font-medium cursor-not-allowed">
                </div>

                <!-- Action Buttons -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2">
                    <button type="button" onclick="imprimirVoucher()" class="w-full bg-zinc-900 hover:bg-zinc-800 active:scale-[0.98] text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition-all shadow-sm flex items-center justify-center gap-2">
                        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        <span data-i18n="btnImprimir">Imprimir / PDF</span>
                    </button>
                    <button type="button" onclick="exportarVoucherAImagen()" class="w-full bg-zinc-100 hover:bg-zinc-200 active:scale-[0.98] text-zinc-900 border border-zinc-300/80 font-semibold py-2.5 px-4 rounded-xl text-sm transition-all shadow-xs flex items-center justify-center gap-2">
                        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span data-i18n="btnImagen">Imagen</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Voucher Card Preview Outer Container -->
        <div id="vouchers-main-wrapper" class="lg:col-span-7 space-y-6">
            <div id="vouchers-list-container" class="space-y-6">
            </div>

            <div id="summary-sheet-wrapper" class="hidden">
            </div>
        </div>

    </div>

    <script>
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }

        function resetScrollToTop() {
            window.scrollTo(0, 0);
            document.body.scrollTop = 0;
            document.documentElement.scrollTop = 0;
        }

        resetScrollToTop();

        window.addEventListener('beforeunload', resetScrollToTop);
        window.addEventListener('unload', resetScrollToTop);
        window.addEventListener('pageshow', resetScrollToTop);
        window.addEventListener('load', resetScrollToTop);
        document.addEventListener('DOMContentLoaded', resetScrollToTop);

        if (window.location.hash) {
            history.replaceState(null, null, window.location.pathname + window.location.search);
        }

        const TSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRXjqliiJ7JPnaYv8POjcyZnCKa0TX8qklWLwz2vYrISQOLBjxMyOVl0LQ3gHCvHIs-BHvJox-ADxvP/pub?output=tsv';

        window.catalogoActividades = {};
        let currentLang = 'es';

        let totalReservasCount = 1;
        let activeReservaIndex = 0;
        let reservasData = [];

        function createDefaultReserva(num) {
            const today = new Date().toISOString().split('T')[0];
            return {
                id: num,
                nombreCliente: '',
                telefono: '',
                hotel: '',
                actividad: '',
                otraActividad: '',
                fechaReserva: today,
                fechaServicio: today,
                adultos: 1,
                menores: 0,
                checkin: '09:00',
                checkinPeriod: 'AM',
                checkpoint: '',
                divisa: 'MXN',
                deposito: '',
                saldo: '',
                tipoCambio: '20.00',
                notas: ''
            };
        }

        function initReservasData() {
            reservasData = [];
            for (let i = 1; i <= 10; i++) {
                reservasData.push(createDefaultReserva(i));
            }
        }

        initReservasData();

        function getSimboloDivisa(d) {
            if (d === 'EUR') return '€';
            return '$';
        }

        const dictionary = {
            es: {
                titleForm: "Captura de Reserva",
                subtitleForm: "Ingrese los detalles para generar el voucher",
                lblCantReservas: "Cantidad de Reservas",
                subCantReservas: "Máximo 10 reservas en un solo voucher",
                lblCliente: "Nombre del Cliente",
                lblTelefono: "Teléfono / WhatsApp",
                lblHotel: "Hotel / Hospedaje",
                lblActividad: "Actividad / Embarcación",
                lblFechaReserva: "Fecha de Reserva (Hoy)",
                lblFechaServicio: "Fecha del Servicio",
                lblAdultos: "Adultos",
                lblMenores: "Menores (4-11)",
                lblCheckin: "Check In",
                lblCheckpoint: "Punto de Encuentro",
                lblDesglosePago: "Desglose de Pago",
                lblDivisa: "Divisa",
                lblDeposito: "Depósito / Anticipo",
                lblSaldo: "Saldo Pendiente",
                lblTotalBalance: "Balance Total (Suma):",
                lblConversor: "Conversor de Divisas Interno",
                lblTC: "T.C. Selección",
                lblEquivalencia: "Equivalencia Estimada",
                lblNotas: "Notas / Observaciones del Servicio",
                lblConfirmacion: "Confirmación Automática",
                btnImprimir: "Imprimir / PDF",
                btnImagen: "Imagen",

                pvMainTitle: "Voucher de Reserva",
                pvSubTitle: "Confirmation Document",
                pvPasajero: "Pasajero Principal",
                pvHotelLabel: "Hotel / Hospedaje",
                pvActividadContratada: "Actividad contratada",
                pvDimension: "Dimensión",
                pvCapacidad: "Capacidad Máxima",

        function formatarFecha(fechaStr, lang = 'es') {
            if (!fechaStr || fechaStr === '---') return '---';
            const partes = fechaStr.split('-');
            if (partes.length !== 3) return fechaStr;

            const anio = partes[0];
            const mesIdx = parseInt(partes[1], 10) - 1;
            const dia = parseInt(partes[2], 10);

            if (lang === 'en') {
                const mesesEN = [
                    'January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'
                ];
                return `${mesesEN[mesIdx]} ${dia}, ${anio}`;
            } else {
                const mesesES = [
                    'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                    'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
                ];
                return `${dia} de ${mesesES[mesIdx]} de ${anio}`;
            }
        }

        function initFormOptions() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('fechaReserva').value = today;
            document.getElementById('fecha').value = today;

            const cSel = document.getElementById('checkin');
            cSel.innerHTML = '';
            const times = [];
            times.push('12:00', '12:30');
            for (let h = 1; h <= 11; h++) {
                let hh = h.toString().padStart(2, '0');
                times.push(`${hh}:00`, `${hh}:30`);
            }
            times.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                if (t === '09:00') opt.selected = true;
                cSel.appendChild(opt);
            });

            const tcSel = document.getElementById('tipoCambio');
            tcSel.innerHTML = '';
            for (let v = 15; v <= 23; v += 0.5) {
                let opt = document.createElement('option');
                opt.value = v.toFixed(2); 
                opt.textContent = `${v.toFixed(2)} MXN`;
                if (v === 20) opt.selected = true;
                tcSel.appendChild(opt);
            }

            updateSelectOptionsLabels();
            renderTabsBar();
        }

        async function fetchActivities() {
            const actSelect = document.getElementById('actividad');
            try {
                const response = await fetch(TSV_URL);
                if (!response.ok) throw new Error('Bloqueo de comunicación.');
                const data = await response.text();
                
                const lines = data.split(/\r?\n/);
                if (lines.length === 0 || !lines[0]) throw new Error('Sheet Vacío');

                const headers = lines[0].split('\t').map(h => h.trim().toLowerCase());
                
                const idxNombre = headers.indexOf('nombre');
                const idxPies = headers.indexOf('pies');
                const idxCapacidad = headers.indexOf('capacidad de personas');
                const idxDescriptivo = headers.indexOf('descriptivo');
                const idxIncluye = headers.indexOf('incluye');

                if (idxNombre === -1) throw new Error('Falta columna estructural "Nombre"');

                actSelect.innerHTML = '<option value="">-- Selecciona una Actividad --</option>';
                
                for (let i = 1; i < lines.length; i++) {
                    const cols = lines[i].split('\t');
                    const nameVal = cols[idxNombre] ? cols[idxNombre].trim() : "";
                    
                    if (nameVal !== "") {
                        window.catalogoActividades[nameVal] = {
                            pies: idxPies !== -1 && cols[idxPies] ? cols[idxPies].trim() : "",
                            capacidad: idxCapacidad !== -1 && cols[idxCapacidad] ? cols[idxCapacidad].trim() : "",
                            descriptivo: idxDescriptivo !== -1 && cols[idxDescriptivo] ? cols[idxDescriptivo].trim() : "",
                            incluye: idxIncluye !== -1 && cols[idxIncluye] ? cols[idxIncluye].trim() : ""
                        };

                        let opt = document.createElement('option');
                        opt.value = nameVal; 
                        opt.textContent = nameVal;
                        actSelect.appendChild(opt);
                    }
                }

                let optOtros = document.createElement('option');
                optOtros.value = "Otros"; 
                optOtros.textContent = dictionary[currentLang].optOther;
                actSelect.appendChild(optOtros);

                loadFromUrlQuery();

            } catch (error) {
                console.error('Error fetching sheet:', error);
                actSelect.innerHTML = '<option value="">⚠️ Error de lectura. Catálogo manual.</option>';
                let optOtros = document.createElement('option');
                optOtros.value = "Otros"; 
                optOtros.textContent = dictionary[currentLang].optManual;
                actSelect.appendChild(optOtros);
                loadFromUrlQuery();
            }
        }

    function createFinancialSummarySheetHtml(sortedItems) {
        const primary = sortedItems[0] || {};
        const cliente = primary.nombreCliente || '---';
        const telefono = primary.telefono || '';
        const hotel = primary.hotel || '---';

        let totalDepositos = 0;
        let totalSaldos = 0;
        let granTotal = 0;

        let tableRows = sortedItems.map((item, idx) => {
            const deposito = parseFloat(item.deposito) || 0;
            const saldo = parseFloat(item.saldo) || 0;
            const total = deposito + saldo;
            const divisa = item.divisa || 'MXN';
            const sym = getSimboloDivisa(divisa);

            totalDepositos += deposito;
            totalSaldos += saldo;
            granTotal += total;

            const actName = (item.actividad === 'Otros') ? (item.otraActividad || '---') : (item.actividad || '---');
            const fechaServ = item.fechaServicio || '---';
            const adultos = item.adultos || 1;
            const menores = item.menores || 0;
            const totalPax = adultos + menores;

            let codigo = "ACT-XXXXXX-" + totalPax;
            if (fechaServ !== '---') {
                const p = fechaServ.split('-');
                codigo = `ACT-${p[0].substring(2)}${p[1]}${p[2]}-${totalPax}`;
            }

            return `
                <tr class="border-b border-zinc-200 text-xs text-zinc-800 ${idx % 2 === 0 ? 'bg-zinc-50/50' : 'bg-white'}">
                    <td class="p-2.5 font-mono font-bold text-zinc-900">${codigo}</td>
                    <td class="p-2.5 font-medium">${formatarFecha(fechaServ, currentLang)}</td>
                    <td class="p-2.5 font-bold text-zinc-950">${actName}</td>
                    <td class="p-2.5 text-center font-medium">${totalPax} PAX</td>
                    <td class="p-2.5 text-right font-bold text-emerald-600">${sym}${deposito.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})} ${divisa}</td>
                    <td class="p-2.5 text-right font-bold text-amber-600">${sym}${saldo.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})} ${divisa}</td>
                    <td class="p-2.5 text-right font-black text-zinc-900">${sym}${total.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})} ${divisa}</td>
                </tr>
            `;
        }).join('');

        const mainDivisa = primary.divisa || 'MXN';
        const mainSym = getSimboloDivisa(mainDivisa);
        const tc = parseFloat(primary.tipoCambio) || 20;

        let refConvStr = "---";
        if (totalSaldos > 0) {
            if (mainDivisa === "USD" || mainDivisa === "EUR") {
                let conv = totalSaldos * tc;
                refConvStr = `$${conv.toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2})} MXN`;
            } else {
                let conv = totalSaldos / tc;
                refConvStr = `$${conv.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})} USD`;
            }
        }

        return `
            <div class="summary-sheet-item bg-white p-5 sm:p-7 rounded-2xl border-2 border-zinc-900 shadow-lg print-card space-y-3.5">
                <div class="border-b-2 border-zinc-900 pb-3 text-center">
                    <h2 class="text-xl sm:text-2xl font-black text-zinc-950 uppercase tracking-tight">${dictionary[currentLang].summaryTitle}</h2>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-zinc-100 p-3 rounded-xl border border-zinc-300 text-xs">
                    <div>
                        <span class="block text-[10px] font-bold uppercase text-zinc-400">${dictionary[currentLang].summaryClientHeader}</span>
                        <span class="font-extrabold text-sm text-zinc-950">${cliente}</span>
                        ${telefono ? `<span class="block text-zinc-600 font-semibold text-xs">📱 ${telefono}</span>` : ''}
                    </div>
                    <div>
                        <span class="block text-[10px] font-bold uppercase text-zinc-400">${dictionary[currentLang].pvHotelLabel}</span>
                        <span class="font-extrabold text-sm text-zinc-950">${hotel}</span>
                    </div>
                    <div>
                        <span class="block text-[10px] font-bold uppercase text-zinc-400">${dictionary[currentLang].summaryTotalBookings}</span>
                        <span class="font-extrabold text-sm text-emerald-700">${sortedItems.length} ${dictionary[currentLang].summaryConfirmedCount}</span>
                    </div>
                </div>

                <div class="overflow-x-auto border border-zinc-300 rounded-xl">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead>
                            <tr class="bg-zinc-900 text-white text-[10px] font-extrabold uppercase tracking-wider">
                                <th class="p-2.5">${dictionary[currentLang].summaryTableCode}</th>
                                <th class="p-2.5">${dictionary[currentLang].summaryTableDate}</th>
                                <th class="p-2.5">${dictionary[currentLang].summaryTableActivity}</th>
                                <th class="p-2.5 text-center">${dictionary[currentLang].summaryTablePax}</th>
                                <th class="p-2.5 text-right">${dictionary[currentLang].summaryTableDeposit}</th>
                                <th class="p-2.5 text-right">${dictionary[currentLang].summaryTableBalance}</th>
                                <th class="p-2.5 text-right">${dictionary[currentLang].summaryTableTotal}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                </div>

                <div class="bg-zinc-950 text-white p-3.5 rounded-xl border border-zinc-800 space-y-2.5">
                    <div class="grid grid-cols-3 gap-3 border-b border-zinc-800 pb-2 text-center">
                        <div>
                            <span class="block text-[9px] font-bold uppercase text-zinc-400">${dictionary[currentLang].summaryTotalDeposits}</span>
                            <span class="text-sm sm:text-base font-black text-emerald-400">${mainSym}${totalDepositos.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})} ${mainDivisa}</span>
                        </div>
                        <div>
                            <span class="block text-[9px] font-bold uppercase text-zinc-400">${dictionary[currentLang].summaryTotalBalances}</span>
                            <span class="text-sm sm:text-base font-black text-amber-400">${mainSym}${totalSaldos.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})} ${mainDivisa}</span>
                        </div>
                        <div>
                            <span class="block text-[9px] font-bold uppercase text-zinc-400">${dictionary[currentLang].summaryGrandTotal}</span>
                            <span class="text-sm sm:text-base font-black text-white">${mainSym}${granTotal.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})} ${mainDivisa}</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-center text-xs text-zinc-300 pt-0.5">
                        <span class="font-medium">${dictionary[currentLang].summaryRefConversion}</span>
                        <span class="font-mono font-bold text-xs sm:text-sm text-zinc-100">${refConvStr}</span>
                    </div>
                </div>

                <div class="text-center text-[9px] text-zinc-400 italic pt-1">
                    ${dictionary[currentLang].summaryFooterNote}
                </div>
            </div>
        `;
    }

    function obtenerUrlVoucher() {
            saveCurrentFormToReservaData();
            const baseUrl = window.location.origin + window.location.pathname;
            const q = new URLSearchParams();
            
            q.append('count', totalReservasCount);
            
            const primary = reservasData[0];
            if(primary.nombreCliente) q.append('n', primary.nombreCliente);
            if(primary.telefono) q.append('p', primary.telefono);
            if(primary.hotel) q.append('h', primary.hotel);

            for (let i = 0; i < totalReservasCount; i++) {
                const res = reservasData[i];
                q.append(`a_${i}`, res.actividad || '');
                if (res.actividad === 'Otros') q.append(`oa_${i}`, res.otraActividad || '');
                q.append(`f_${i}`, res.fechaServicio || '');
                q.append(`ad_${i}`, res.adultos || 1);
                q.append(`mn_${i}`, res.menores || 0);
                q.append(`ci_${i}`, `${res.checkin || '09:00'} ${res.checkinPeriod || 'AM'}`);
                q.append(`cp_${i}`, res.checkpoint || '');
                q.append(`dep_${i}`, res.deposito || 0);
                q.append(`sal_${i}`, res.saldo || 0);
                q.append(`d_${i}`, res.divisa || 'MXN');
                q.append(`tc_${i}`, res.tipoCambio || 20);
                if (res.notas) q.append(`no_${i}`, res.notas);
            }

            q.append('lang', currentLang);
            q.append('view', 'voucher');

            return `${baseUrl}?${q.toString()}`;
        }

        function loadFromUrlQuery() {
            const q = new URLSearchParams(window.location.search);
            if (q.toString() !== "") {
                if (q.has('lang')) switchLanguage(q.get('lang'));
                if (q.has('count')) {
                    totalReservasCount = Math.min(10, Math.max(1, parseInt(q.get('count')) || 1));
                    document.getElementById('select-cant-reservas').value = totalReservasCount;
                }

                const primaryName = q.get('n') || '';
                const primaryPhone = q.get('p') || '';
                const primaryHotel = q.get('h') || '';

                for (let i = 0; i < totalReservasCount; i++) {
                    const res = reservasData[i];
                    res.nombreCliente = primaryName;
                    res.telefono = primaryPhone;
                    res.hotel = primaryHotel;

                    if (q.has(`a_${i}`)) res.actividad = q.get(`a_${i}`);
                    if (q.has(`oa_${i}`)) res.otraActividad = q.get(`oa_${i}`);
                    if (q.has(`f_${i}`)) res.fechaServicio = q.get(`f_${i}`);
                    if (q.has(`ad_${i}`)) res.adultos = parseInt(q.get(`ad_${i}`)) || 1;
                    if (q.has(`mn_${i}`)) res.menores = parseInt(q.get(`mn_${i}`)) || 0;

                    if (q.has(`ci_${i}`)) {
                        const ciVal = q.get(`ci_${i}`);
                        const parts = ciVal.split(' ');
                        if (parts.length === 2) {
                            res.checkin = parts[0];
                            res.checkinPeriod = parts[1];
                        } else {
                            res.checkin = ciVal;
                        }
                    }

                    if (q.has(`cp_${i}`)) res.checkpoint = q.get(`cp_${i}`);
                    if (q.has(`dep_${i}`)) res.deposito = q.get(`dep_${i}`);
                    if (q.has(`sal_${i}`)) res.saldo = q.get(`sal_${i}`);
                    if (q.has(`d_${i}`)) res.divisa = q.get(`d_${i}`);
                    if (q.has(`tc_${i}`)) res.tipoCambio = q.get(`tc_${i}`);
                    if (q.has(`no_${i}`)) res.notas = q.get(`no_${i}`);
                }

                if (q.get('view') === 'voucher') {
                    const formCol = document.getElementById('form-container');
                    const voucherWrapper = document.getElementById('vouchers-main-wrapper');
                    
                    if (formCol) formCol.remove();
                    if (voucherWrapper) {
                        voucherWrapper.classList.remove('lg:col-span-7');
                        voucherWrapper.classList.add('lg:col-span-12', 'max-w-3xl', 'mx-auto', 'my-2');
                    }
                }
            }

            renderTabsBar();
            loadFormFromReservaData(0);
            renderAllVouchers();
        }

        function mostrarToast(mensaje) {
            let toast = document.getElementById('custom-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'custom-toast';
                toast.className = 'fixed bottom-5 right-5 bg-zinc-900 text-white text-xs px-4 py-3 rounded-xl shadow-2xl z-50 transition-opacity duration-300 opacity-0 pointer-events-none max-w-xs border border-zinc-700';
                document.body.appendChild(toast);
            }
            toast.textContent = mensaje;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 4500);
        }

        function imprimirVoucher() {
            window.print();
        }

        function exportarVoucherAImagen() {
            saveCurrentFormToReservaData();
            const target = document.getElementById('vouchers-main-wrapper');
            
            const posicionScrollOriginal = window.scrollY;
            window.scrollTo(0, 0);

            const opciones = {
                useCORS: true, 
                scale: 2.5, 
                backgroundColor: '#f4f4f5',
                scrollX: 0,
                scrollY: 0,
                logging: false,
                onclone: (clonedDoc) => {
                    const clonedTarget = clonedDoc.getElementById('vouchers-main-wrapper');
                    if (clonedTarget) {
                        clonedTarget.style.width = '720px';
                        clonedTarget.style.maxWidth = '720px';
                        clonedTarget.style.margin = '0 auto';
                        clonedTarget.style.padding = '20px';
                        clonedTarget.style.boxSizing = 'border-box';
                    }
                }
            };

            setTimeout(() => {
                html2canvas(target, opciones).then(canvas => {
                    const enlace = document.createElement('a');
                    enlace.download = `Vouchers_Reserva.png`;
                    enlace.href = canvas.toDataURL('image/png');
                    enlace.click();
                    
                    window.scrollTo(0, posicionScrollOriginal);
                    mostrarToast(dictionary[currentLang].msgImagenDescargada || "¡Imagen descargada con éxito!");
                }).catch(err => {
                    console.error("Error procesando la captura de imagen:", err);
                    window.scrollTo(0, posicionScrollOriginal);
                });
            }, 100);
        }

        // Event listeners para renderizado en tiempo real
        const inputsToSync = ['nombreCliente', 'telefono', 'hotel', 'actividad', 'otraActividad', 'fecha', 'adultos', 'menores', 'checkin', 'checkpoint', 'deposito', 'saldo', 'divisa', 'tipoCambio', 'notas'];
        inputsToSync.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', renderAllVouchers);
                el.addEventListener('change', renderAllVouchers);
            }
        });

        // Inicializaciones
        initFormOptions();
        fetchActivities();
        renderTabsBar();
        loadFormFromReservaData(0);
        renderAllVouchers();
        resetScrollToTop();
    </script>
